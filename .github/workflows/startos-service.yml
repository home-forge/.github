name: StartoOS Service CI/CD

on:
  workflow_call:
    inputs:
      run_build:
        description: Run multi-arch Docker build and package to .s9pk
        type: boolean
        default: false
      deploy_to_dev:
        description: Deploy .s9pk to Pi dev StartoOS after build
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint manifest.yaml
        run: pip install yamllint --quiet && yamllint manifest.yaml

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: No lint suppressions
        run: |
          found=$(grep -rn \
            -e "hadolint ignore" \
            -e "# noqa" \
            -e "# type: ignore" \
            -e "eslint-disable" \
            -e "//nolint" \
            --include="Dockerfile*" \
            --include="*.py" \
            --include="*.ts" \
            --include="*.go" \
            . 2>/dev/null || true)
          if [[ -n "$found" ]]; then
            echo "ERROR: lint suppression directives are not allowed — fix the root cause"
            echo "$found"
            exit 1
          fi

      - name: Setup Deno
        if: hashFiles('scripts/**/*.ts') != ''
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno lint
        if: hashFiles('scripts/**/*.ts') != ''
        run: deno lint scripts/

      - name: Deno test
        if: hashFiles('scripts/**/*.test.ts') != ''
        run: deno test scripts/ --allow-read

      - name: Setup Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go test
        if: hashFiles('go.mod') != ''
        run: go test ./...

      # Python lane: opt-in by having a pyproject.toml at the repo root (none of the
      # older requirements.txt-based services have one, so they are unaffected).
      # The Python version comes from [project].requires-python; dev tools come from
      # the `dev` extra; ruff/pytest are configured in pyproject.toml.
      - name: Setup Python
        if: hashFiles('pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python package
        if: hashFiles('pyproject.toml') != ''
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -e ".[dev]" --quiet
          pip install ruff pytest --quiet

      - name: Ruff
        if: hashFiles('pyproject.toml') != ''
        run: ruff check .

      - name: Pytest
        if: hashFiles('pyproject.toml') != ''
        run: |
          set +e
          pytest -q
          rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "No tests collected — treating as success"
            exit 0
          fi
          exit "$rc"

  # Builds linux/amd64 natively on GitHub-hosted runner
  build-amd64:
    if: inputs.run_build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}-amd64

  # Builds linux/arm64 natively on the Pi self-hosted runner (no QEMU)
  build-arm64:
    if: inputs.run_build
    runs-on: [self-hosted, arm64, linux]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}-arm64

      - name: Prune Docker images and build cache
        if: always()
        run: |
          docker image prune -af
          docker builder prune -f --filter "until=24h"

  # Combines the two arch images, runs start-sdk build + verify, uploads .s9pk
  package:
    if: inputs.run_build
    needs: [build-amd64, build-arm64]
    runs-on: [self-hosted, arm64, linux]
    permissions:
      contents: read
      packages: write
    outputs:
      s9pk_name: ${{ steps.find.outputs.name }}
      s9pk_path: ${{ steps.find.outputs.s9pk_path }}
      service_id: ${{ steps.find.outputs.service_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine into multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:${{ github.sha }} \
            ghcr.io/${{ github.repository }}:${{ github.sha }}-amd64 \
            ghcr.io/${{ github.repository }}:${{ github.sha }}-arm64

      - name: Install npm dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Build .s9pk
        run: make s9pk
        env:
          DOCKER_REPO: ghcr.io/${{ github.repository }}
          DOCKER_TAG: ${{ github.sha }}

      - name: Verify .s9pk
        run: make verify

      # The runner workspace is shared: a later package job (e.g. a feature PR) re-checks
      # it out and replaces the .s9pk before this run's deploy-to-dev starts. Copy the
      # artifact to a per-run directory that deploy-to-dev reads instead of the workspace.
      # Keyed by run_id (not run_attempt) so re-running only deploy-to-dev still finds it.
      - name: Find .s9pk, service ID and hand off
        id: find
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          name=$(ls *.s9pk | head -1)
          sid=$(grep '^id:' manifest.yaml | head -1 | sed 's/^id:[[:space:]]*//' | tr -d '"')
          HANDOFF_ROOT="$HOME/s9pk-handoff"
          HANDOFF_DIR="$HANDOFF_ROOT/$REPO_NAME/$RUN_ID"
          mkdir -p "$HANDOFF_DIR"
          cp "$name" "$HANDOFF_DIR/$name"
          # Drop handoffs that no deploy cleaned up (failed or abandoned runs).
          find "$HANDOFF_ROOT" -mindepth 2 -maxdepth 2 -type d -mtime +2 -exec rm -rf {} +
          find "$HANDOFF_ROOT" -mindepth 1 -type d -empty -not -path "$HANDOFF_DIR" -delete
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "service_id=${sid}" >> "$GITHUB_OUTPUT"
          echo "s9pk_path=${HANDOFF_DIR}/${name}" >> "$GITHUB_OUTPUT"
          echo "Handed off ${name} to ${HANDOFF_DIR}"

      - name: Prune Docker images
        if: always()
        run: docker image prune -af

  # Deploys the .s9pk to the Pi dev StartoOS instance via start-cli
  deploy-to-dev:
    if: inputs.deploy_to_dev
    needs: [package]
    runs-on: [self-hosted, arm64, linux]
    # Two deploys of the same service must not race each other on the dev host.
    # Groups are repo-scoped; cross-service serialization relies on the single runner
    # plus the flock in deploy_to_dev.sh.
    concurrency:
      group: dev-deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # The .s9pk and service ID come from the package job's per-run handoff directory,
      # not the workspace: another run's package job may have re-checked it out meanwhile.
      - name: Verify .s9pk handoff
        env:
          S9PK_PATH: ${{ needs.package.outputs.s9pk_path }}
        run: |
          if [ ! -f "$S9PK_PATH" ]; then
            echo "::error::[HANDOFF_MISSING] .s9pk not found at ${S9PK_PATH} — re-run the whole workflow run so the package job rebuilds it"
            exit 1
          fi
          echo "Using ${S9PK_PATH}"

      - name: Update runner scripts
        run: |
          git -C ~/home-forge/home-forge-setup fetch --depth=1 origin main
          git -C ~/home-forge/home-forge-setup reset --hard origin/main
          echo "home-forge-setup at: $(git -C ~/home-forge/home-forge-setup rev-parse --short HEAD)"

      - name: Deploy to dev StartoOS
        run: ~/skills/deploy_to_dev.sh "${{ github.event.repository.name }}" "$S9PK_PATH"
        env:
          S9PK_PATH: ${{ needs.package.outputs.s9pk_path }}
          SERVICE_ID: ${{ needs.package.outputs.service_id }}

      - name: Remove .s9pk handoff
        if: success()
        env:
          S9PK_PATH: ${{ needs.package.outputs.s9pk_path }}
        run: |
          dir=$(dirname "$S9PK_PATH")
          rm -rf "$dir"
          rmdir --ignore-fail-on-non-empty "$(dirname "$dir")"
